<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mikki_Tyler | Лавка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --surface: #0a0a0a;
      --surface-subtle: #111111;
      --line: #1f1f1f;
      --line-hover: #333333;
      
      --text: #ededed;
      --text-dim: #999999;
      --text-muted: #666666;
      
      --accent: #ffffff;
      --green: #22c55e;
      --yellow: #eab308;
      --blue: #60a5fa;

      --font: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'Geist Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 64px 24px 120px;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }

    .wrapper {
      max-width: 1120px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .system-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .nav-tabs {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9999px;
      padding: 3px;
      gap: 2px;
    }

    .tab {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab .count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .tab.active .count {
      color: var(--text-dim);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 24px;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      position: relative;
      transition: background 0.2s ease;
    }

    .card:hover {
      background: var(--surface);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 24px;
    }

    .item-id {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .item-stock {
      font-family: var(--mono);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      line-height: 1.4;
    }

    .stock-main {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .stock-main::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }

    /* Увеличенный и более контрастный текст времени */
    .stock-sub {
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: -0.01em;
    }

    .item-stock.rented .stock-main {
      color: var(--yellow);
    }

    .item-stock.rented .stock-main::before {
      background: var(--yellow);
    }

    .item-stock.empty .stock-main {
      color: var(--text-muted);
    }

    .item-stock.empty .stock-main::before {
      background: var(--text-muted);
    }

    .image-stage {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .image-stage img {
      max-height: 110px;
      max-width: 110px;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.9));
      transition: transform 0.2s ease;
    }

    .card:hover .image-stage img {
      transform: scale(1.05);
    }

    .card-content {
      margin-bottom: 28px;
    }

    .item-name {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .item-desc {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--text-dim);
      min-height: 38px;
    }

    .item-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .period-list {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 2px;
      background: var(--surface);
    }

    .period-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 0;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .period-btn:hover {
      color: var(--text);
    }

    .period-btn.active {
      background: var(--surface-subtle);
      color: var(--text);
    }

    .pricing-table {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .price-name {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-family: var(--mono);
      letter-spacing: 0.05em;
    }

    .price-val-cash {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .price-val-azp {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <div class="brand-group">
        <span class="system-label">Mikki Tyler | Лавка</span>
        <h1 class="brand-title">Лавка аренды</h1>
      </div>

      <div class="nav-tabs">
        <button class="tab active" onclick="setFilter('all', this)">Все <span class="count" id="c-all"></span></button>
        <button class="tab" onclick="setFilter('accessory', this)">Аксессуары <span class="count" id="c-acc"></span></button>
        <button class="tab" onclick="setFilter('skin', this)">Скины <span class="count" id="c-skn"></span></button>
      </div>
    </header>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    let rawItems = [];
    let activeFilter = 'all';

    async function init() {
      try {
        const res = await fetch(`./items.json?t=${Date.now()}`, { cache: 'no-store' });
        rawItems = await res.json();
        updateCounters();
        render();
      } catch (e) {
        console.error(e);
      }
    }

    function formatTimeLeft(targetDate) {
      const diffMs = targetDate - new Date();
      if (diffMs <= 0) return 'прямо сейчас';

      const diffMins = Math.floor(diffMs / 60000);
      const days = Math.floor(diffMins / (60 * 24));
      const hours = Math.floor((diffMins % (60 * 24)) / 60);
      const mins = diffMins % 60;

      if (days > 0) {
        return hours > 0 ? `через ${days} д ${hours} ч` : `через ${days} д`;
      }
      if (hours > 0) {
        return mins > 0 ? `через ${hours} ч ${mins} мин` : `через ${hours} ч`;
      }
      return `через ${mins} мин`;
    }

    function calculateStatus(totalStock, rentsList = []) {
      const now = new Date();
      const validRents = rentsList
        .map(d => new Date(d))
        .filter(d => !isNaN(d) && d > now)
        .sort((a, b) => a - b);

      const rentedCount = validRents.length;
      const availableStock = Math.max(0, totalStock - rentedCount);
      const nextDate = validRents.length > 0 ? validRents[0] : null;

      // 1. Все сдано в аренду (в наличии 0, но скоро освободится)
      if (availableStock === 0 && nextDate) {
        return {
          main: 'Все заняты',
          sub: `Слетит ${formatTimeLeft(nextDate)}`,
          className: 'rented'
        };
      }

      // 2. Нет в наличии вообще (пустой склад)
      if (availableStock === 0) {
        return {
          main: 'Нет в наличии',
          sub: '',
          className: 'empty'
        };
      }

      // 3. Часть доступна, часть в аренде
      if (rentedCount > 0) {
        return {
          main: `В наличии: ${availableStock} из ${totalStock} шт.`,
          sub: `Слетит ${formatTimeLeft(nextDate)}`,
          className: ''
        };
      }

      // 4. Свободно всё
      return {
        main: `В наличии: ${availableStock} шт.`,
        sub: '',
        className: ''
      };
    }

    function updateCounters() {
      document.getElementById('c-all').textContent = rawItems.length;
      document.getElementById('c-acc').textContent = rawItems.filter(i => i.category === 'accessory').length;
      document.getElementById('c-skn').textContent = rawItems.filter(i => i.category === 'skin').length;
    }

    function render() {
      const container = document.getElementById('grid');
      container.innerHTML = '';

      const items = activeFilter === 'all' 
        ? rawItems 
        : rawItems.filter(i => i.category === activeFilter);

      items.forEach(item => {
        const status = calculateStatus(item.stock || 0, item.activeRents || []);

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${item.id}`;

        card.innerHTML = `
          <div class="card-meta">
            <span class="item-id">#${item.id}</span>
            <div class="item-stock ${status.className}">
              <span class="stock-main">${status.main}</span>
              ${status.sub ? `<span class="stock-sub">${status.sub}</span>` : ''}
            </div>
          </div>

          <div class="image-stage">
            <img src="${item.image}" alt="${item.title}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'32\\' height=\\'32\\' fill=\\'%23333\\' viewBox=\\'0 0 16 16\\'><path d=\\'M3 5a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H3z\\'/></svg>'"/>
          </div>

          <div class="card-content">
            <h2 class="item-name">${item.title}</h2>
            <p class="item-desc">${item.description || ''}</p>
          </div>

          <div class="item-bottom">
            <div class="period-list">
              <button class="period-btn active" onclick="setPeriod('${item.id}', 'd1', this)">24H</button>
              <button class="period-btn" onclick="setPeriod('${item.id}', 'd7', this)">7D</button>
              <button class="period-btn" onclick="setPeriod('${item.id}', 'd30', this)">30D</button>
            </div>

            <div class="pricing-table">
              <div class="price-row">
                <span class="price-name">Вирты</span>
                <span class="price-val-cash" id="cash-${item.id}">${item.rates?.d1?.cash || '—'}</span>
              </div>
              <div class="price-row">
                <span class="price-name">АЗП</span>
                <span class="price-val-azp" id="azp-${item.id}">${item.rates?.d1?.azp || '—'}</span>
              </div>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function setPeriod(id, period, el) {
      const item = rawItems.find(i => i.id === id);
      if (!item || !item.rates) return;

      const card = el.closest('.card');
      card.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');

      document.getElementById(`cash-${id}`).textContent = item.rates[period]?.cash || '—';
      document.getElementById(`azp-${id}`).textContent = item.rates[period]?.azp || '—';
    }

    function setFilter(cat, el) {
      activeFilter = cat;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
